<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Region Capture Scroll Fixture</title>
    <style>
      :root {
        scroll-behavior: smooth;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 3500px;
        background: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      #in-view-box {
        position: absolute;
        left: 160px;
        top: 180px;
        width: 400px;
        height: 300px;
        background: rgb(34, 197, 94);
      }

      #tall-region-box {
        position: absolute;
        left: 640px;
        top: 300px;
        width: 420px;
        height: 1800px;
      }

      .tall-top {
        width: 100%;
        height: 600px;
        background: rgb(59, 130, 246);
      }

      .tall-middle {
        width: 100%;
        height: 600px;
        background: rgb(245, 158, 11);
      }

      .tall-bottom {
        width: 100%;
        height: 600px;
        background: rgb(239, 68, 68);
      }
    </style>
  </head>
  <body>
    <div id="in-view-box" data-testid="in-view-box"></div>
    <div id="tall-region-box" data-testid="tall-region-box">
      <div class="tall-top"></div>
      <div class="tall-middle"></div>
      <div class="tall-bottom"></div>
    </div>
  </body>
</html>
