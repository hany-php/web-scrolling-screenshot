<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPA Inner Scroll Fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      #spa-scroll-shell {
        width: 100%;
        height: 100vh;
        overflow-y: auto;
      }

      .band {
        width: 100%;
        height: 1000px;
      }

      .band-top {
        background: rgb(16, 185, 129);
      }

      .band-mid {
        background: rgb(139, 92, 246);
      }

      .band-bottom {
        height: 1200px;
        background: rgb(249, 115, 22);
      }
    </style>
  </head>
  <body>
    <main id="spa-scroll-shell">
      <div class="band band-top"></div>
      <div class="band band-mid"></div>
      <div class="band band-bottom"></div>
    </main>
  </body>
</html>
